# splat config for the boot executable SLPM_86.053 (PS-X EXE, SDK: PsyQ 3.x, mixed library vintages, see wiki/psyq-sdk.md).
# Layout facts: wiki/executable.md. File offset = vram - 0x80041000 + 0x800.
name: SLPM_86.053
sha1: e823bd844a8f8fa4d05483b59c66bc54b8393b26
options:
  basename: SLPM_86.053
  target_path: disc/files/SLPM_86.053
  elf_path: build/SLPM_86.053.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/SLPM_86.053.ld
  ld_dependencies: True
  ld_bss_is_noload: True

  find_file_boundaries: False
  gp_value: 0x800EB670

  o_as_suffix: True
  use_legacy_include_asm: False
  # splat would overwrite the hand-maintained include/*.h and macro.inc (T-0013)
  generate_asm_macros_files: False
  # keep asm for decompiled functions too, so tools/progress.py has a full denominator
  disassemble_all: True
  # rodata islands (T-1340): tools/rodata_pieces.py hands the rodata to the functions itself
  migrate_rodata_to_functions: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel

  section_order: [".text", ".rodata", ".data", ".bss"]
  auto_link_sections: [".data", ".rodata", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.txt
    # SDK names live at 0x80086810-0x800AF340, inside the main exe only; overlay configs would reject them
    - config/symbol_addrs_sdk.txt
    # provisional game names from O.BIN (T-0600), hypotheses; see wiki/obin.md
    - config/symbol_addrs_obin.txt
    # main-exe-only function sizes (T-0500)
    - config/symbol_addrs_main.txt
    - config/labels/main.txt
  reloc_addrs_path:
    - config/reloc_addrs.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  subalign: 2
  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  # PS-X EXE header, 0x800 bytes
  - name: header
    type: header
    start: 0x0

