<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Translation review · Tokimeki Memorial</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><body><header><div><span class="eyebrow">TOKIMEKI MEMORIAL</span><h1>Translation review</h1></div><a href="/api/export.csv">Export review sheet ↗</a></header><section id="summary" class="summary" aria-live="polite"></section><main><div class="toolbar"><label class="search">Find an asset<input id="query" type="search" placeholder="Name, frame, palette, context…"></label><label>Status<select id="status"><option value="unreviewed">Needs review</option><option value="reviewed">Reviewed</option><option value="translated">All translated images</option><option value="approve">Style approved</option><option value="request_changes">Changes requested</option><option value="stale">Approval outdated</option><option value="untranslated">Untranslated Japanese</option><option value="needs_triage">Suspected text</option><option value="unknown">Unrepresented sources</option><option value="no_translation_assigned">Other decoded assets</option><option value="inventory">All inventory</option></select></label><label>Batch<select id="batch"><option value="">All batches</option></select></label><fieldset><legend>Pixel zoom</legend><button type="button" data-zoom="1">Native 1×</button><button type="button" data-zoom="2">2×</button><button type="button" data-zoom="4" class="active">4×</button></fieldset></div><div class="results"><span id="result-count"></span><span class="quiet">Style review · technical and runtime acceptance stay separate</span></div><p id="error" role="alert" hidden></p><section id="assets" aria-live="polite"></section><nav class="pagination"><button id="previous">← Previous</button><span id="page"></span><button id="next">Next →</button></nav><footer id="coverage"></footer></main></body></html>
