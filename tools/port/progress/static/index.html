<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Port captures</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="viewer" aria-label="Port media viewer">
    <section class="stage" aria-label="Selected capture">
      <div id="media-stage" class="media-stage"><!--INITIAL_MEDIA--></div>
      <div id="port-progress" class="port-progress" role="img" aria-label="Estimated overall Japanese port progress: <!--INITIAL_PROGRESS--> percent. First slice: <!--INITIAL_FIRST_SLICE--> percent." title="Estimated progress toward the complete Japanese port. First slice: <!--INITIAL_FIRST_SLICE-->%.">
        <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="progress-track" cx="18" cy="18" r="15.5"></circle><circle id="progress-arc" class="progress-arc" style="--dash-offset: <!--INITIAL_OFFSET-->" cx="18" cy="18" r="15.5"></circle></svg>
        <span><strong id="progress-value"><!--INITIAL_QUALIFIER--><!--INITIAL_PROGRESS-->%</strong><small>PORT</small></span>
      </div>
      <button id="fullscreen" class="icon-button fullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      </button>
      <button id="previous" class="icon-button nav previous" type="button" aria-label="Previous capture" title="Previous capture">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button id="next" class="icon-button nav next" type="button" aria-label="Next capture" title="Next capture">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </section>
    <nav id="timeline" class="timeline" aria-label="Capture timeline"></nav>
  </main>
</body>
</html>
